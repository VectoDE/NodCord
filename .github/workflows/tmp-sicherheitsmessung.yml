name: Temporär - Sicherheitsmessung

# Nur Messung, kein Upload in Code Scanning. Wird nach dem Lauf wieder entfernt.
on:
  push:
    branches: ['ci/sicherheitsmessung']
  workflow_dispatch:

permissions: {}

jobs:
  messung:
    name: osv, gitleaks, Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OSV_VERSION: v2.7.1
      GITLEAKS_VERSION: 8.30.1
      SEMGREP_VERSION: 1.186.0
    steps:
      - name: Checkout (volle Historie)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Werkzeuge laden und Checksummen prüfen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/tools"
          base="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}"
          curl -fsSL -O "$base/osv-scanner_linux_amd64"
          curl -fsSL -O "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: osv-scanner
        run: |
          "$RUNNER_TEMP/tools/osv-scanner_linux_amd64" scan -L package-lock.json --format json > "$RUNNER_TEMP/out/osv.json" || echo "osv-scanner Exit-Code $?"

      - name: gitleaks (gesamte Historie)
        run: |
          "$RUNNER_TEMP/tools/gitleaks" git --redact --report-format sarif --report-path "$RUNNER_TEMP/out/gitleaks.sarif" . || echo "gitleaks Exit-Code $?"

      - name: Semgrep
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/venv/bin/semgrep" scan --config p/default --config p/owasp-top-ten --config p/secrets --config p/typescript --config p/nodejs --sarif -o "$RUNNER_TEMP/out/semgrep.sarif" --metrics=off . || echo "semgrep Exit-Code $?"

      - name: Ergebnisse hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sicherheitsmessung
          path: |
            ${{ runner.temp }}/out/osv.json
            ${{ runner.temp }}/out/gitleaks.sarif
            ${{ runner.temp }}/out/semgrep.sarif
          retention-days: 3
          if-no-files-found: error
